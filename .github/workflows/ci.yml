name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  api-contract:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Test grounded search API contract
        run: pytest tests/test_search_api.py tests/test_health.py

  mongodb-integration:
    name: MongoDB integration
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Test MongoDB persistence
        env:
          MONGODB_URI: mongodb://localhost:27017
        run: pytest -m integration

  atlas-search-integration:
    name: Atlas Search integration
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongodb/mongodb-atlas-local:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Test Atlas Search adapter
        env:
          ATLAS_LOCAL_URI: mongodb://localhost:27017/?directConnection=true
        run: pytest -m atlas_local

  opensearch-integration:
    name: OpenSearch vector integration
    runs-on: ubuntu-latest
    services:
      opensearch:
        image: opensearchproject/opensearch:2.19.1
        env:
          discovery.type: single-node
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 18
          --health-start-period 30s
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Test OpenSearch ingestion and vector retrieval
        env:
          OPENSEARCH_LOCAL_URL: http://localhost:9200
        run: pytest -m opensearch_local

  container:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag agent-search-platform:ci .
